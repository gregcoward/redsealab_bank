worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temporary directory paths for unprivileged execution
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Serve static assets
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Mock health check endpoint for OpenShift Liveness/Readiness probes
        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Reverse proxy to MinIO AIStore S3 Endpoint in OpenShift
        location /s3/ {
            resolver 172.30.0.10 valid=10s ipv6=off;
            
            set $s3_target_host "aistor-primary-hl.aistor-primary.svc.cluster.local:9000";
            if ($http_x_s3_target_host != "") {
                set $s3_target_host $http_x_s3_target_host;
            }

            set $s3_proto "https";
            if ($http_x_s3_proto != "") {
                set $s3_proto $http_x_s3_proto;
            }

            # Handle CORS preflight OPTIONS requests directly
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Amz-Date, X-Amz-Content-SHA256, X-S3-Target-Host, X-S3-Proto, x-amz-user-agent, x-amz-security-token' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                return 204;
            }

            # CORS headers for actual requests
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Expose-Headers' 'ETag, Content-Length, Content-Type, X-Amz-Request-Id' always;

            set $s3_backend "$s3_proto://$s3_target_host";
            rewrite ^/s3/(.*) /$1 break;
            proxy_pass $s3_backend;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_set_header Host $s3_target_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 100M;
        }

        # Reverse proxy to F5 AI Guardrails Endpoint in OpenShift
        location /guardrails/ {
            resolver 172.30.0.10 valid=10s ipv6=off;
            
            set $guardrails_target_host "cai-moderator.cai-moderator.svc.cluster.local:5500";
            if ($http_x_guardrails_target_host != "") {
                set $guardrails_target_host $http_x_guardrails_target_host;
            }

            set $guardrails_proto "http";
            if ($http_x_guardrails_proto != "") {
                set $guardrails_proto $http_x_guardrails_proto;
            }

            # Handle CORS preflight OPTIONS requests directly
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Guardrails-Target-Host, X-Guardrails-Proto' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                return 204;
            }

            # CORS headers for actual requests
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;

            set $guardrails_backend "$guardrails_proto://$guardrails_target_host";
            rewrite ^/guardrails/(.*) /$1 break;
            proxy_pass $guardrails_backend;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_set_header Host $guardrails_target_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 50M;
        }

        # Cache static image media files
        location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Do not cache JS/CSS to ensure instant application updates
        location ~* \.(js|css)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
