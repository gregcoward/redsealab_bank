name: redsealab-bank

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gregcoward/redsealab_bank:latest
    container_name: redsealab-bank
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
